version: "3.8"

services:
  backend:
    image: ghcr.io/nastronot/sticky-icky-backend:latest
    # Fixed names: Watchtower on arda follows these two containers by name.
    container_name: sticky-icky-backend
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS}
    expose:
      - "8765"
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
    restart: unless-stopped

  frontend:
    image: ghcr.io/nastronot/sticky-icky-frontend:latest
    # No published port. The only way in is the Cloudflare tunnel, which
    # reaches this container by name over the shared `edge` network, so
    # every request passes Cloudflare Access first. Publishing a host port
    # would let anyone on the LAN print without logging in.
    container_name: sticky-icky-frontend
    networks:
      - default
      - edge
    depends_on:
      - backend
    restart: unless-stopped

networks:
  edge:
    external: true
